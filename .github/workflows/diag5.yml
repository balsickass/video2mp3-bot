name: diag5

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Introspect --local AND normal modes
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          chmod +x tests/probe_deep.sh
          bash tests/probe_deep.sh "local" --local --http-port=8081 --dir=/var/lib/telegram-bot-api
          bash tests/probe_deep.sh "normal" --http-port=8081 --dir=/var/lib/telegram-bot-api
