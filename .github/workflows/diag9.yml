name: diag9

on:
  workflow_dispatch:

jobs:
  big:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: PHASE A - NON-local server, 30 MB payload
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/tapi && chmod 777 /tmp/tapi
          docker rm -f tapi >/dev/null 2>&1 || true
          docker run -d --name tapi --network host \
            -v /tmp/tapi:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID="$TG_API_ID" \
            -e TELEGRAM_API_HASH="$TG_API_HASH" \
            aiogram/telegram-bot-api:latest
          sleep 3
          for i in $(seq 1 30); do
            curl -sf --max-time 5 "http://localhost:8081/bot$T/getMe" >/dev/null 2>&1 && break
            sleep 2
          done
          python3 -u tests/probe_bigfile.py "PHASE A: NON-local, 30MB" || true
          echo "--- container log tail ---"; docker logs tapi 2>&1 | tail -12

      - name: PHASE B - LOCAL server, 30 MB payload
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          docker rm -f tapi >/dev/null 2>&1 || true
          rm -rf /tmp/tapi && mkdir -p /tmp/tapi && chmod 777 /tmp/tapi
          docker run -d --name tapi --network host \
            -v /tmp/tapi:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID="$TG_API_ID" \
            -e TELEGRAM_API_HASH="$TG_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          sleep 3
          for i in $(seq 1 30); do
            curl -sf --max-time 5 "http://localhost:8081/bot$T/getMe" >/dev/null 2>&1 && break
            sleep 2
          done
          python3 -u tests/probe_bigfile.py "PHASE B: LOCAL, 30MB" || true
          echo "--- container log tail ---"; docker logs tapi 2>&1 | tail -12