name: probe-localapi

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Can a GHA runner host Telegram's own Bot API server?
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          echo "api_id present: $([ -n "${TG_API_ID:-}" ] && echo yes || echo NO)  (len ${#TG_API_ID})"
          echo "api_hash present: $([ -n "${TG_API_HASH:-}" ] && echo yes || echo NO)  (len ${#TG_API_HASH})"
          echo
          echo "=== docker available on the runner? ==="
          docker version --format '{{.Server.Version}}' 2>&1 | head -2
          echo
          mkdir -p /tmp/tapi
          for IMG in tdlib/telegram-bot-api:latest aiogram/telegram-bot-api:latest; do
            echo "=== trying $IMG ==="
            if timeout 120 docker pull -q "$IMG" >/dev/null 2>&1; then
              echo "  pulled $IMG OK"
              docker run -d --name tapi --network host \
                -v /tmp/tapi:/var/lib/telegram-bot-api \
                -e TELEGRAM_API_ID="$TG_API_ID" \
                -e TELEGRAM_API_HASH="$TG_API_HASH" \
                "$IMG" --local --http-port=8081 --dir=/var/lib/telegram-bot-api >/dev/null 2>&1
              sleep 20
              echo "  --- container state ---"
              docker ps -a --filter name=tapi --format '  {{.Status}}' 2>&1
              echo "  --- container logs ---"
              docker logs tapi 2>&1 | tail -15
              echo "  --- getMe THROUGH THE LOCAL SERVER (port 8081) ---"
              curl -s --max-time 20 "http://localhost:8081/bot$T/getMe" | head -c 500
              echo
              echo "  --- and can it clear a webhook / poll locally? ---"
              curl -s --max-time 20 "http://localhost:8081/bot$T/getUpdates?timeout=1&offset=0" | head -c 300
              echo
              break
            else
              echo "  ❌ could not pull $IMG"
            fi
          done
          echo
          echo "=== baseline: is the file limit actually raised in --local mode? ==="
          curl -s --max-time 20 "http://localhost:8081/bot$T/getMe" >/dev/null 2>&1 \
            && echo "  local server is answering (in --local mode getFile returns a LOCAL PATH and the 20MB cap is gone)" \
            || echo "  local server NOT answering"
