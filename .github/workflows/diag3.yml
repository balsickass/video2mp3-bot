name: diag3

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Start the local Bot API server (same flags as production)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p /tmp/tapi && chmod 777 /tmp/tapi
          docker rm -f tapi >/dev/null 2>&1 || true
          docker run -d --name tapi --network host \
            -v /tmp/tapi:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID="$TG_API_ID" \
            -e TELEGRAM_API_HASH="$TG_API_HASH" \
            aiogram/telegram-bot-api:latest \
            --local --http-port=8081 --dir=/var/lib/telegram-bot-api
          for i in $(seq 1 30); do
            curl -sf --max-time 5 "http://localhost:8081/bot$T/getMe" >/dev/null 2>&1 && {
              echo "server ready (attempt $i)"; break; }
            sleep 2
          done
      - name: Probe the download path (never calls getUpdates)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_BASE: "http://localhost:8081"
        run: python3 -u tests/probe_download_path.py
