name: diag2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run the REAL bot.py for ~70s, unbuffered, capture everything
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MINUTES: "1"
          WORKFLOW_FILE: "no-chain-during-diag.yml"
        run: |
          echo "=== python / ffmpeg ==="
          python3 -V
          ffmpeg -version | head -1
          echo "RUN_MINUTES=$RUN_MINUTES  DEADLINE will be START+60s"
          echo
          echo "=== import test (does the module even load?) ==="
          python3 -c "import ast,sys; src=open('bot.py').read(); ast.parse(src); print('AST parse OK,', len(src), 'bytes')"
          python3 -u -c "
          import os
          os.environ.setdefault('TELEGRAM_BOT_TOKEN', os.environ['TELEGRAM_BOT_TOKEN'])
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('bt', 'bot.py')
          m = importlib.util.module_from_spec(spec)
          sys.modules['bt'] = m
          spec.loader.exec_module(m)
          print('IMPORT OK — module executed')
          print('  TG_BOT host      :', m.TG. split('/bot')[0])
          print('  RUN_MIN          :', m.RUN_MIN)
          print('  DEADLINE-START   :', round(m.DEADLINE - m.START, 1), 'sec')
          print('  SETTINGS         :', m.SETTINGS)
          print('  ffmpeg found     :', __import__('shutil').which('ffmpeg'))
          print('  getUpdates test  :')
          try:
              r = m.tg('getUpdates', {'timeout': 1, 'offset': 0}, timeout=20)
              print('    -> HTTP OK, ok=%s, updates=%d' % (r.get('ok'), len(r.get('result', []))))
          except Exception as e:
              print('    -> EXCEPTION %s: %s' % (type(e).__name__, e))
          "
          echo
          echo "=== now the real shift loop (70s cap) ==="
          timeout 70 python3 -u bot.py 2>&1
          echo "EXIT CODE: $?"
